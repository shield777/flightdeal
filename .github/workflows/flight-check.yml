# 프로모션·카드 확인 + 항공사 목록
# - 자동: 한국시간 오전 6시~밤 10시, 2시간마다 하루 9번 모든 나라의 프로모션·카드 확인 → data/promos.json (알림 없음)
#   한 번에 3~4분 걸려서 5분 일찍 시작 (정각은 GitHub 예약 실행이 몰려 늦어지기 쉬움)
# - promos: 앱 항공권 검색 탭의 [지금 확인] → 고른 나라만 바로 확인
# - routes: ⚙ 설정의 [항공사 목록 새로 만들기] → data/airlines-by-city.json (도시별 서울 출발 직항 항공사)
# 설정 방법: SETUP.md
name: 프로모션 확인·항공사 목록

on:
  schedule:
    # 한국시간 5:55·7:55·9:55·11:55·13:55·15:55·17:55·19:55·21:55 시작 → 6·8·10·12·14·16·18·20·22시쯤 결과
    # (한국시간 = UTC + 9시간이라 UTC 20:55, 22:55, 0:55, 2:55, 4:55, 6:55, 8:55, 10:55, 12:55)
    - cron: '55 20,22,0,2,4,6,8,10,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'promos = 프로모션 확인, routes = 도시별 직항 항공사 목록'
        type: choice
        options: [promos, routes]
        default: promos
      country:
        description: '프로모션을 찾을 나라 (예: 베트남, 필리핀). 비우면 모든 나라'
        default: ''

permissions:
  contents: write

concurrency:
  group: flight-${{ inputs.mode || 'promos' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 도시별 직항 항공사 목록
        if: ${{ inputs.mode == 'routes' }}
        run: node scripts/airline-routes.js
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
      - name: 프로모션·카드 확인
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'promos' }}
        # 특가 뉴스(기사 본문까지)·카드 할인. 항공사 홈페이지는 카드·결제 혜택만 (카드 탭)
        run: |
          # 비엣젯 홈페이지는 화면을 자바스크립트로 그려서, 서버에 설치된 크롬으로 열어 읽음 (연결 도구만 설치)
          npm i --no-save --no-audit --no-fund --silent playwright-core@1.48.2 || echo "크롬 연결 도구 설치 실패 → 비엣젯 홈페이지 확인만 건너뜀"
          node scripts/flight-check.js --promos
        env:
          # 자동 실행이거나 나라를 비우면 모든 나라
          PROMO_COUNTRY: ${{ inputs.country || 'ALL' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }} # 할인율 70% 이상 특가 알림 (ntfy 앱)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "${{ inputs.mode == 'routes' && '항공사 목록' || '프로모션 확인' }} $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 4; done
          exit 1
