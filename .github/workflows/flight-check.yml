# 앱 버튼을 누를 때만 실행 (매일 자동 실행은 없음)
# - promos: 프로모션·카드 탭의 [지금 확인] → data/promos.json
# - routes: ⚙ 설정의 [항공사 목록 새로 만들기] → data/airlines-by-city.json (도시별 서울 출발 직항 항공사)
# 설정 방법: SETUP.md
name: 프로모션 확인·항공사 목록

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'promos = 프로모션 확인, routes = 도시별 직항 항공사 목록'
        type: choice
        options: [promos, routes]
        default: promos
      country:
        description: '프로모션을 찾을 나라 (예: 베트남, 필리핀). 비우면 기본 나라'
        default: ''

permissions:
  contents: write

concurrency:
  group: flight-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 도시별 직항 항공사 목록
        if: ${{ inputs.mode == 'routes' }}
        run: node scripts/airline-routes.js
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
      - name: 프로모션 확인
        if: ${{ inputs.mode == 'promos' }}
        run: |
          # 비엣젯 공식 특가 게시판은 화면을 자바스크립트로 그려서, 서버에 설치된 크롬으로 열어 읽음 (연결 도구만 설치)
          npm i --no-save --no-audit --no-fund --silent playwright-core@1.48.2 || echo "크롬 연결 도구 설치 실패 → 비엣젯 공식 확인만 건너뜀"
          node scripts/flight-check.js --promos
        env:
          PROMO_COUNTRY: ${{ inputs.country }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "${{ inputs.mode == 'routes' && '항공사 목록' || '프로모션 확인' }} $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 4; done
          exit 1
